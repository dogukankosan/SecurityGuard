<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecurityGuard — Merkezi Panel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Ctext x='50' y='52' font-size='60' text-anchor='middle' dominant-baseline='central'%3E%F0%9F%9B%A1%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#eef1f6; --bg2:#e4e9f1; --panel:#ffffff; --panel2:#f6f8fc; --line:#e4e8f0;
    --text:#131824; --muted:#5e6a80; --faint:#8b95a8;
    --green:#16a34a; --orange:#ea8a00; --red:#e11d48; --blue:#2563eb; --gray:#94a3b8; --purple:#7c3aed;
    --accent:#2563eb; --accentText:#ffffff; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
    --shadowL:0 20px 60px rgba(16,24,40,.22); --radius:14px;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0b0e14; --bg2:#070a0f; --panel:#141922; --panel2:#1b212c; --line:#283040;
    --text:#e9edf5; --muted:#9aa6bb; --faint:#687387;
    --green:#34d07f; --orange:#f5a524; --red:#fb5b78; --blue:#5aa2ff; --gray:#64748b; --purple:#a78bfa;
    --accent:#5aa2ff; --accentText:#06101d; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
    --shadowL:0 24px 70px rgba(0,0,0,.6);
  }}
  :root[data-theme="dark"]{
    --bg:#0b0e14; --bg2:#070a0f; --panel:#141922; --panel2:#1b212c; --line:#283040;
    --text:#e9edf5; --muted:#9aa6bb; --faint:#687387;
    --green:#34d07f; --orange:#f5a524; --red:#fb5b78; --blue:#5aa2ff; --gray:#64748b; --purple:#a78bfa;
    --accent:#5aa2ff; --accentText:#06101d; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
    --shadowL:0 24px 70px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20;box-shadow:var(--shadow)}
  .brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:750;letter-spacing:-.01em}
  .brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--purple));display:grid;place-items:center;color:#fff;font-size:16px;box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 45%,transparent)}
  .brand small{color:var(--muted);font-weight:500;font-size:13px}
  .grow{flex:1}
  input,button,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none;transition:border-color .15s,background .15s,box-shadow .15s}
  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
  input::placeholder{color:var(--faint)}
  button{cursor:pointer;font-weight:600}
  .btn{background:var(--accent);border-color:var(--accent);color:var(--accentText)}
  .btn:hover{filter:brightness(1.08)}
  .ghost:hover{background:var(--line)}
  .iconbtn{width:40px;padding:9px 0;text-align:center;font-size:15px}
  .wrap{padding:18px 20px 48px;max-width:1640px;margin:0 auto}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .card .ico{position:absolute;right:12px;top:12px;font-size:19px;opacity:.5}
  .card .n{font-size:29px;font-weight:780;line-height:1.05;letter-spacing:-.02em}
  .card .l{color:var(--muted);font-size:12.5px;margin-top:4px;font-weight:500}
  .card.hot{background:linear-gradient(180deg,color-mix(in srgb,var(--red) 10%,var(--panel)),var(--panel));border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
  .card.hot .n{color:var(--red)}
  .card.warnc .n{color:var(--orange)}
  /* dikkat şeridi */
  .alerts{margin-bottom:18px}
  .alerts h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 9px;display:flex;align-items:center;gap:7px}
  .alerts .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .alert{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gray);border-radius:11px;padding:11px 13px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
  .alert:hover{transform:translateY(-2px)}
  .alert.l3{border-left-color:var(--red)} .alert.l2{border-left-color:var(--orange)}
  .alert .m{font-weight:650;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .alert .r{color:var(--muted);font-size:12.5px;margin-top:3px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:transparent;border:0;border-radius:0;padding:8px 14px;color:var(--muted);font-weight:600;font-size:13px}
  .seg button.on{background:var(--accent);color:var(--accentText)}
  .meta{color:var(--faint);font-size:12.5px;margin-left:auto;display:flex;align-items:center;gap:8px}
  .live{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:12px 15px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:var(--panel2);color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none;position:sticky;top:0}
  th .ar{opacity:.6;font-size:10px}
  tbody tr{cursor:pointer;transition:background .1s}
  tbody tr:hover{background:var(--panel2)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr.rhot{background:color-mix(in srgb,var(--red) 6%,transparent)}
  tbody tr.rhot:hover{background:color-mix(in srgb,var(--red) 11%,transparent)}
  .hdot{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 18%,transparent)}
  td.cust{font-weight:650;white-space:normal;min-width:150px}
  td.mut,.mut{color:var(--faint)}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .pill .d{width:7px;height:7px;border-radius:50%}
  .on{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)} .on .d{background:var(--green)}
  .off{background:color-mix(in srgb,var(--gray) 22%,transparent);color:var(--gray)} .off .d{background:var(--gray)}
  .ok{color:var(--green)} .warn{color:var(--orange)} .crit{color:var(--red)} .blue{color:var(--blue)}
  .chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:8px;background:var(--panel2)}
  .c-ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
  .c-warn{background:color-mix(in srgb,var(--orange) 17%,transparent);color:var(--orange)}
  .c-crit{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
  .badge{display:inline-block;min-width:22px;text-align:center;padding:2px 7px;border-radius:7px;font-weight:700;font-size:12px}
  .badge.hot{background:var(--red);color:#fff}
  .msg{padding:50px;text-align:center;color:var(--muted)}
  .err{background:color-mix(in srgb,var(--red) 10%,transparent);color:var(--red);border:1px solid color-mix(in srgb,var(--red) 30%,transparent);padding:12px 16px;border-radius:11px;margin-bottom:14px;font-weight:500}
  /* modal popup */
  .ov{position:fixed;inset:0;background:rgba(10,14,22,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:50;overflow:auto}
  .ov.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadowL);width:min(960px,100%);max-height:92vh;display:flex;flex-direction:column;transform:scale(.97);opacity:0;transition:transform .18s,opacity .18s}
  .ov.open .modal{transform:none;opacity:1}
  .mhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:14px}
  .mhead .ava{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--purple));display:grid;place-items:center;color:#fff;font-size:20px;flex:none}
  .mhead h2{margin:0;font-size:21px;letter-spacing:-.01em}
  .mhead .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .mhead .x{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;width:34px;height:34px;flex:none;font-size:15px}
  .statusrow{display:flex;flex-wrap:wrap;gap:8px;padding:14px 22px 0}
  .tabs{display:flex;gap:2px;flex-wrap:wrap;padding:12px 16px 0;border-bottom:1px solid var(--line)}
  .tabs button{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 13px;color:var(--muted);font-weight:600;font-size:13px}
  .tabs button:hover{color:var(--text)}
  .tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
  .tabs button .cnt{color:var(--faint);font-weight:700;font-size:11px}
  .mbody{padding:18px 22px;overflow:auto}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:11px;margin-bottom:6px}
  .tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-left:4px solid var(--gray)}
  .tile.l1{border-left-color:var(--blue)} .tile.l2{border-left-color:var(--orange)} .tile.l3{border-left-color:var(--red)}
  .tile .t{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
  .tile .v{font-weight:750;font-size:17px;margin:3px 0}
  .tile .d{color:var(--muted);font-size:12px;line-height:1.45}
  h3.sec{margin:20px 0 10px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .todo{display:flex;gap:10px;padding:10px 12px;border-radius:10px;margin-bottom:7px;font-size:13px;align-items:flex-start;background:var(--panel2);border-left:3px solid var(--gray)}
  .todo.l2{border-left-color:var(--orange);background:color-mix(in srgb,var(--orange) 8%,var(--panel2))}
  .todo.l3{border-left-color:var(--red);background:color-mix(in srgb,var(--red) 9%,var(--panel2))}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;font-size:13px}
  .kv .k{color:var(--muted)}
  #tabc .tablewrap{box-shadow:none} #tabc th{font-size:11px;padding:9px 12px} #tabc td{padding:9px 12px;white-space:normal}
  @media (max-width:640px){ .kv{grid-template-columns:1fr;gap:2px 0} .kv .k{margin-top:8px} th,td{padding:10px} }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">🛡️</span> SecurityGuard <small>Merkezi Panel</small></div>
  <span class="grow"></span>
  <input id="q" placeholder="🔎 Müşteri / makine ara…" style="width:210px">
  <input id="key" type="password" placeholder="Yönetici anahtarı" style="width:200px">
  <label class="mut" style="display:flex;align-items:center;gap:5px;font-size:12.5px"><input id="remember" type="checkbox" style="width:auto;padding:0"> hatırla</label>
  <button id="go" class="btn">Bağlan</button>
  <button id="refresh" class="ghost iconbtn" title="Yenile">↻</button>
  <button id="theme" class="ghost iconbtn" title="Tema">🌓</button>
</header>
<div class="wrap">
  <div id="err" class="err" style="display:none"></div>
  <div class="cards" id="cards"></div>
  <div class="alerts" id="alerts" style="display:none"></div>
  <div class="toolbar" id="toolbar" style="display:none">
    <div class="seg" id="filters">
      <button data-f="all" class="on">Tümü</button>
      <button data-f="issues">⚠ Sorunlu</button>
      <button data-f="on">Çevrimiçi</button>
      <button data-f="off">Çevrimdışı</button>
      <button data-f="exp">Lisansı bitiyor</button>
    </div>
    <button id="excel" class="ghost">📊 Excel'e aktar</button>
    <div class="meta"><span id="liveDot" class="live"></span><span id="updated"></span></div>
  </div>
  <div id="content"><div class="msg">Yönetici anahtarını girip <b>Bağlan</b>'a bas.</div></div>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>

<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const OFFLINE_MIN=8;
let AUTO=null, SORT={k:'_sev',dir:-1}, ROWS=[], FILTER='all', LASTOK=null;

function applyTheme(t){const r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);
  $('#theme').textContent=t==='dark'?'🌙':t==='light'?'☀️':'🌓';$('#theme').title='Tema: '+({auto:'otomatik',light:'açık',dark:'koyu'}[t]);}
function cycleTheme(){const cur=localStorage.getItem('sgtheme')||'auto';const nx={auto:'light',light:'dark',dark:'auto'}[cur];try{localStorage.setItem('sgtheme',nx)}catch{}applyTheme(nx);}
applyTheme(localStorage.getItem('sgtheme')||'auto');

function loadKey(){try{const r=localStorage.getItem('sgkey');if(r){$('#remember').checked=true;return r;}return sessionStorage.getItem('sgkey')||'';}catch{return''}}
function saveKey(v){try{if($('#remember').checked){localStorage.setItem('sgkey',v);sessionStorage.removeItem('sgkey');}else{sessionStorage.setItem('sgkey',v);localStorage.removeItem('sgkey');}}catch{}}

function esc(s){return(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function pUtc(s){return s?Date.parse(s.endsWith('Z')?s:s+'Z'):NaN}
function ageMin(s){const t=pUtc(s);return isNaN(t)?Infinity:(Date.now()-t)/60000}
function fmtAge(s){if(!s)return'hiç';const m=ageMin(s);if(m<1)return'az önce';if(m<60)return Math.floor(m)+' dk önce';if(m<1440)return Math.floor(m/60)+' sa önce';return Math.floor(m/1440)+' gün önce'}
function fmtDT(s){const t=pUtc(s);return isNaN(t)?(s||'-'):new Date(t).toLocaleString('tr-TR')}
function fmtDate(s){const t=pUtc(s);return isNaN(t)?(s||'-'):new Date(t).toLocaleDateString('tr-TR')}
function daysLeft(s){const t=pUtc(s);return isNaN(t)?null:Math.ceil((t-Date.now())/86400000)}
function online(r){return r.LastHeartbeatUtc&&ageMin(r.LastHeartbeatUtc)<OFFLINE_MIN}

/* sağlık / öncelik: 3=kritik,2=uyarı,0=ok ; sebep metinleri */
function issues(r){
  const out=[], d=daysLeft(r.ExpiresUtc), on=online(r), seen=r.LastHeartbeatUtc!=null;
  if(d!=null&&d<0) out.push({lvl:3,t:'lisans doldu'});
  if(!on) out.push({lvl: seen?2:2, t: seen?'çevrimdışı':'hiç bağlanmadı'});
  if(on&&(r.CriticalEvents24h||0)>0) out.push({lvl:3,t:(r.CriticalEvents24h)+' kritik olay (24s)'});
  if(on&&r.ProtectionOk===false) out.push({lvl:3,t:'koruma kapalı'});
  if(d!=null&&d>=0&&d<=14) out.push({lvl:2,t:'lisans '+d+' gün'});
  if(on&&r.SqlMonitoring===false) out.push({lvl:2,t:'SQL izlenmiyor'});
  return out;
}
function sev(r){ return issues(r).reduce((m,i)=>Math.max(m,i.lvl),0); }
function hcolor(s){ return s>=3?'var(--red)':s>=2?'var(--orange)':'var(--green)'; }

async function api(path){
  const r=await fetch(path,{headers:{'X-Admin-Key':$('#key').value.trim()},cache:'no-store'});
  if(r.status===401)throw'Yönetici anahtarı kabul edilmedi (401).';
  if(r.status===403)throw'HTTPS zorunlu ya da IP izinli değil (403).';
  if(r.status===404)throw'Erişim yok (404): IP izin listesinde değilsiniz.';
  if(!r.ok)throw'Sunucu hatası: '+r.status;
  return r.json();
}

async function load(){
  const key=$('#key').value.trim();
  if(!key){$('#content').innerHTML='<div class="msg">Yönetici anahtarını girip <b>Bağlan</b>\'a bas.</div>';return;}
  saveKey(key);$('#err').style.display='none';
  try{
    ROWS=await api('/api/v1/admin/panel/agents'); LASTOK=new Date();
    ROWS.forEach(r=>r._sev=sev(r));
    $('#toolbar').style.display='flex'; render();
    if(!AUTO)AUTO=setInterval(load,30000);
  }catch(e){$('#err').textContent=e;$('#err').style.display='block';if(AUTO){clearInterval(AUTO);AUTO=null;}}
}

function visibleRows(){
  const q=$('#q').value.trim().toLowerCase();
  let rows=ROWS.filter(r=>!q||(r.CustomerName||'').toLowerCase().includes(q)||(r.MachineName||'').toLowerCase().includes(q)||(r.HwId||'').toLowerCase().includes(q));
  if(FILTER==='on')rows=rows.filter(online);
  else if(FILTER==='off')rows=rows.filter(r=>!online(r));
  else if(FILTER==='exp')rows=rows.filter(r=>{const d=daysLeft(r.ExpiresUtc);return d!=null&&d<=14;});
  else if(FILTER==='issues')rows=rows.filter(r=>r._sev>0);
  else if(FILTER==='crit')rows=rows.filter(r=>(r.CriticalEvents24h||0)>0);
  else if(FILTER==='upd')rows=rows.filter(r=>r.AvailableVersion);
  rows.sort((a,b)=>{let x=a[SORT.k],y=b[SORT.k];if(SORT.k==='ExpiresUtc'||SORT.k==='LastHeartbeatUtc'){x=pUtc(x)||0;y=pUtc(y)||0;}x=x==null?'':x;y=y==null?'':y;let c=(x>y?1:x<y?-1:0)*SORT.dir; if(c===0&&SORT.k==='_sev')c=(a.CriticalEvents24h||0)>(b.CriticalEvents24h||0)?-1:1; return c;});
  return rows;
}

function render(){
  const on=ROWS.filter(online).length, off=ROWS.length-on;
  const crit=ROWS.reduce((s,r)=>s+(r.CriticalEvents24h||0),0), bans=ROWS.reduce((s,r)=>s+(r.NewBans24h||0),0);
  const expSoon=ROWS.filter(r=>{const d=daysLeft(r.ExpiresUtc);return d!=null&&d<=14;}).length;
  const upd=ROWS.filter(r=>r.AvailableVersion).length;
  $('#cards').innerHTML=[
    card('🖥️',ROWS.length,'Müşteri (aktif lisans)','','all'),
    card('🟢',on,'Çevrimiçi','ok','on'),
    card('⚪',off,'Çevrimdışı',off>0?'warnc':'','off'),
    card('🔴',crit,'24s kritik olay',crit>0?'hot':'','crit'),
    card('⏳',expSoon,'Lisansı bitiyor (≤14g)',expSoon>0?'warnc':'','exp'),
    card('⬆️',upd,'Güncellenebilir',upd>0?'warnc':'','upd'),
  ].join('');
  $('#updated').textContent='son güncelleme '+(LASTOK?LASTOK.toLocaleTimeString('tr-TR'):'-');
  $$('#cards [data-filter]').forEach(cd=>cd.onclick=()=>setFilter(cd.dataset.filter));

  // dikkat şeridi
  const prob=ROWS.filter(r=>r._sev>0).sort((a,b)=>b._sev-a._sev||(b.CriticalEvents24h||0)-(a.CriticalEvents24h||0));
  if(prob.length){
    $('#alerts').style.display='block';
    $('#alerts').innerHTML=`<h3>⚠ Dikkat gerektiren <span class="badge ${prob.some(r=>r._sev>=3)?'hot':''}">${prob.length}</span></h3><div class="grid">`+
      prob.slice(0,12).map(r=>{const is=issues(r).sort((a,b)=>b.lvl-a.lvl);const ev=(r.CriticalEvents24h||0)>0?'events':'';return`<div class="alert l${r._sev}" data-id="${r.LicenseId}" data-ev="${ev}"><div class="m">${esc(r.CustomerName)} <span class="hdot" style="color:${hcolor(r._sev)}"></span></div><div class="r">${esc(r.MachineName)||'-'} · ${is.map(i=>`<span class="${i.lvl>=3?'crit':'warn'}">${esc(i.t)}</span>`).join(' · ')}</div></div>`;}).join('')+'</div>';
    $$('#alerts .alert').forEach(a=>a.onclick=()=>detail(a.dataset.id, a.dataset.ev||'ozet', a.dataset.ev==='events'?'crit':'all'));
  } else $('#alerts').style.display='none';

  const rows=visibleRows();
  if(rows.length===0){$('#content').innerHTML='<div class="tablewrap"><div class="msg">Kayıt yok.</div></div>';return;}
  const H=(k,t)=>`<th data-k="${k}">${t} ${SORT.k===k?`<span class="ar">${SORT.dir>0?'▲':'▼'}</span>`:''}</th>`;
  let h='<div class="tablewrap"><div class="scroll"><table><thead><tr><th data-k="_sev" title="Sağlık"></th>'+
    H('CustomerName','Müşteri')+H('MachineName','Makine')+'<th>Durum</th>'+H('ExpiresUtc','Lisans')+
    '<th>Koruma</th><th>SQL</th>'+H('BannedIps','Ban')+H('CriticalEvents24h','24s Kritik')+
    H('MemoryMb','Bellek')+H('AgentVersion','Sürüm')+H('LastHeartbeatUtc','Son görülme')+'</tr></thead><tbody>';
  for(const r of rows){
    const isOn=online(r), d=daysLeft(r.ExpiresUtc), seen=r.LastHeartbeatUtc==null, s=r._sev;
    const lic=d==null?'<span class="mut">-</span>':d<0?'<span class="crit">doldu</span>':d<=14?`<span class="warn">${d} gün</span>`:`<span class="ok">${d} gün</span>`;
    h+=`<tr data-id="${r.LicenseId}" class="${s>=3?'rhot':''}">`+
      `<td><span class="hdot" style="color:${hcolor(s)}"></span></td>`+
      `<td class="cust">${esc(r.CustomerName)}</td>`+
      `<td>${esc(r.MachineName)||'<span class="mut">-</span>'}</td>`+
      `<td><span class="pill ${isOn?'on':'off'}"><span class="d"></span>${isOn?'çevrimiçi':'çevrimdışı'}</span></td>`+
      `<td>${lic}</td>`+
      `<td>${seen?'<span class="mut">?</span>':yn(r.ProtectionOk)}</td>`+
      `<td>${seen?'<span class="mut">?</span>':yn(r.SqlMonitoring)}</td>`+
      `<td>${seen?'<span class="mut">-</span>':r.BannedIps}</td>`+
      `<td>${seen?'<span class="mut">-</span>':(r.CriticalEvents24h>0?`<span class="badge hot" style="cursor:pointer" title="Kritik olayları gör" onclick="event.stopPropagation();detail(${r.LicenseId},'events','crit')">${r.CriticalEvents24h}</span>`:'0')}</td>`+
      `<td>${r.MemoryMb?r.MemoryMb+' MB':'<span class="mut">-</span>'}</td>`+
      `<td class="mut">${esc(r.AgentVersion)||'-'}${r.AvailableVersion?` <span class="chip c-warn" title="${r.UpdateReady?'İndirildi, onay bekliyor':'İndiriliyor'}">⬆ ${esc(r.AvailableVersion)}${r.UpdateReady?' ✓':''}</span>`:''}</td>`+
      `<td class="${isOn?'':'warn'}">${fmtAge(r.LastHeartbeatUtc)}</td></tr>`;
  }
  h+='</tbody></table></div></div>';
  $('#content').innerHTML=h;
  $$('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;SORT.dir=(SORT.k===k)?-SORT.dir:(k==='_sev'||k==='CriticalEvents24h'||k==='BannedIps'||k==='MemoryMb'?-1:1);SORT.k=k;render();});
  $$('tbody tr').forEach(tr=>tr.onclick=()=>detail(tr.dataset.id));
}
function card(ico,n,l,c,f){return`<div class="card ${c}" ${f?`data-filter="${f}" style="cursor:pointer"`:''}><span class="ico">${ico}</span><div class="n">${n}</div><div class="l">${l}</div></div>`}
function yn(b){return b?'<span class="ok">✓</span>':'<span class="crit">✕</span>'}
function setFilter(f){FILTER=f;$$('#filters button').forEach(x=>x.classList.toggle('on',x.dataset.f===f));render();const el=$('#toolbar');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}

async function detail(id,tab,ev){
  try{
    const r=await api('/api/v1/admin/panel/agents/'+id);
    let rep=null;if(r.Payload){try{rep=JSON.parse(r.Payload)}catch{}}
    window._D={r,rep}; window._evf=ev||'all';
    const d=daysLeft(r.ExpiresUtc),isOn=online(r);
    const chips=[
      `<span class="pill ${isOn?'on':'off'}"><span class="d"></span>${isOn?'çevrimiçi':'çevrimdışı'}</span>`,
      chip(d==null?'lisans ?':d<0?'lisans doldu':'lisans '+d+' gün',d==null?'':d<0?'crit':d<=14?'warn':'ok'),
      chip('koruma '+(r.ProtectionOk?'açık':'?'),r.ProtectionOk?'ok':'warn'),
      chip('SQL '+(r.SqlMonitoring?'izleniyor':'?'),r.SqlMonitoring?'ok':'warn'),
      chip(r.ServiceReady?'kurulum tamam':'kurulum eksik',r.ServiceReady?'ok':'warn'),
      (r.CriticalEvents24h>0?chip(r.CriticalEvents24h+' kritik (24s)','crit'):''),
    ].join('');
    const secMap={events:'Olaylar',backup:'Yedekler',ports:'Portlar',security:'Güvenlik',performance:'Performans',sql:'SQL',services:'Servisler'};
    window._rdpF={from:dInput(Date.now()-7*864e5),to:dInput(Date.now()),user:''};
    const tabs=[{k:'ozet',t:'Özet'}];
    if(rep&&rep.Rdp)tabs.push({k:'rdp',t:'RDP',c:rep.Rdp.length});
    if(rep&&rep.Sections)rep.Sections.forEach(s=>tabs.push({k:s.Key,t:secMap[s.Key]||s.Title.split(' (')[0],c:(s.Rows||[]).length}));
    tabs.push({k:'bilgi',t:'Bilgi'});
    $('#modal').innerHTML=
      `<div class="mhead"><div class="ava">🖥️</div><div><h2>${esc(r.CustomerName)}</h2>`+
      `<div class="sub">${esc(r.MachineName)||'makine ?'} · ${esc(r.AgentVersion)||'?'} · son görülme ${fmtAge(r.LastHeartbeatUtc)}</div></div>`+
      `<button class="x" onclick="closeModal()">✕</button></div>`+
      `<div class="statusrow">${chips}</div>`+
      `<div class="tabs" id="tabs">${tabs.map((t,i)=>`<button data-k="${t.k}" class="${i?'':'on'}">${esc(t.t)}${t.c?` <span class="cnt">${t.c}</span>`:''}</button>`).join('')}</div>`+
      `<div class="mbody"><div id="tabc"></div></div>`;
    const open=tab||'ozet';
    $$('#tabs button').forEach(b=>{b.onclick=()=>{$$('#tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(b.dataset.k!=='events')window._evf='all';showTab(b.dataset.k);};b.classList.toggle('on',b.dataset.k===open);});
    showTab(open);
    $('#ov').classList.add('open');
  }catch(e){alert(e);}
}
function showTab(k){
  const {r,rep}=window._D||{};let h='';
  if(k==='rdp'){ showRdp(); return; }
  if(k==='ozet'){
    const p=rep&&rep.Dashboard;
    if(p){
      h='<div class="tiles">'+(p.Tiles||[]).map(t=>`<div class="tile l${t.Level||0}"><div class="t">${esc(t.Title)}</div><div class="v">${esc(t.Value)}</div><div class="d">${esc(t.Detail)}</div></div>`).join('')+'</div>';
      if((p.Todos||[]).length)h+='<h3 class="sec">Dikkat edilmesi gerekenler</h3>'+p.Todos.map(t=>`<div class="todo l${t.Level||0}"><span>${esc(t.Text)}</span></div>`).join('');
    }else h='<div class="msg">Bu ajandan henüz detaylı anlık görüntü gelmedi.<br><span class="mut">Ajanı güncel sürüme yükseltince tüm sekmeler dolar.</span></div>';
  }else if(k==='bilgi'){
    const d=daysLeft(r.ExpiresUtc);
    h='<div class="kv">'+kv('Müşteri',r.CustomerName)+kv('Makine',r.MachineName)+kv('Donanım kimliği',r.HwId)+
      kv('Ajan sürümü',r.AgentVersion)+kv('Lisans bitiş',fmtDate(r.ExpiresUtc)+(d!=null?` (${d<0?'doldu':d+' gün'})`:''))+
      kv('Son heartbeat',fmtDT(r.LastHeartbeatUtc))+kv('Lisans son doğrulama',fmtDT(r.LastSeenUtc))+kv('Son IP',r.LastIp)+
      kv('Bellek',r.MemoryMb?r.MemoryMb+' MB':'-')+kv('Bekleyen mail',r.PendingMail)+
      kv('Güncelleme',r.AvailableVersion?(r.AvailableVersion+(r.UpdateReady?' — indirildi, onay bekliyor':' — indiriliyor')):'güncel')+
      kv('Not',r.Note)+'</div>';
  }else h=renderTable((rep&&rep.Sections||[]).find(s=>s.Key===k));
  $('#tabc').innerHTML=h;
  $$('#tabc [data-ef]').forEach(b=>b.onclick=()=>{window._evf=b.dataset.ef;showTab('events');});
}
function renderTable(sec){
  if(!sec)return'<div class="msg">Veri yok.</div>';
  const note=sec.Note?`<div class="mut" style="margin-bottom:10px">${esc(sec.Note)}</div>`:'';
  let rows=sec.Rows||[], chips='';
  if(sec.Key==='events'){
    const f=window._evf||'all';
    chips='<div class="seg" style="margin-right:auto">'+[['all','Tümü'],['crit','🔴 Kritik'],['warn','Uyarı']].map(([k,t])=>`<button data-ef="${k}" class="${f===k?'on':''}">${t}</button>`).join('')+'</div>';
    if(f==='crit')rows=rows.filter(r=>r[1]==='Kritik'); else if(f==='warn')rows=rows.filter(r=>r[1]==='Uyarı');
  }
  const bar=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:9px">${chips}<button class="ghost" onclick='exportSection(${JSON.stringify(sec.Key)})'>📊 Excel'e aktar</button></div>`;
  if(!rows.length)return note+bar+'<div class="msg">Kayıt yok. 🎉</div>';
  let h=note+bar+'<div class="tablewrap"><div class="scroll"><table><thead><tr>'+sec.Columns.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr></thead><tbody>';
  for(const row of rows)h+='<tr>'+row.map(c=>`<td class="${sevClass(c)}">${esc(c)}</td>`).join('')+'</tr>';
  return h+'</tbody></table></div></div>';
}
function sevClass(v){v=(v==null?'':v).toString();
  if(v==='Kritik'||v==='Hatalı'||v==='durmuş')return'crit';
  if(v==='Uyarı'||v==='evet')return'warn';
  if(v==='Bilgi'||v==='çalışıyor'||v==='Tamamlandı'||v==='Geçti')return'ok';
  return'';}
function chip(t,c){return t?`<span class="chip ${c?'c-'+c:''}">${esc(t)}</span>`:''}
function kv(k,v){if(v==null||v==='')v='-';return`<div class="k">${k}</div><div>${esc(v)}</div>`}
function closeModal(){$('#ov').classList.remove('open');}

/* ---- RDP sekmesi (tarih filtresi + toplam süre) ---- */
function dInput(ms){const d=new Date(ms),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function fmtDur(s){ s=+s||0; if(s<=0)return'0dk'; const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60); if(d>0)return d+'g '+h+'sa'; if(h>0)return h+'sa '+m+'dk'; return m+'dk'; }
function rdpFiltered(){
  const D=window._D||{}, list=(D.rep&&D.rep.Rdp)||[], f=window._rdpF||{};
  const fromMs=f.from?Date.parse(f.from+'T00:00:00'):0, toMs=f.to?Date.parse(f.to+'T23:59:59'):Date.now()+864e5;
  const u=(f.user||'').trim().toLowerCase();
  const act=r=>r.State==='Açık'||r.State==='Bağlantı kopuk';
  return list.filter(r=>{const t=Date.parse(r.Start); if(!isNaN(t)&&(t<fromMs||t>toMs))return false; if(u&&!(((r.User||'')+'').toLowerCase().includes(u)))return false; if(f.active&&!act(r))return false; return true;});
}
function showRdp(){
  const D=window._D||{}, f=window._rdpF||{}, rows=rdpFiltered();
  const wh=(D.rep&&D.rep.WorkHours)||'';
  const byUser={}; rows.forEach(r=>byUser[r.User]=(byUser[r.User]||0)+(+r.DurationSeconds||0));
  const totals=Object.keys(byUser).map(u=>({u,s:byUser[u]})).sort((a,b)=>b.s-a.s);
  const open=rows.filter(r=>r.State==='Açık'||r.State==='Bağlantı kopuk').length, off=rows.filter(r=>r.OffHours).length;
  let h=`<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px">
    <span class="mut">Başlangıç</span><input type="date" id="rf" value="${f.from||''}" style="width:150px">
    <span class="mut">Bitiş</span><input type="date" id="rt" value="${f.to||''}" style="width:150px">
    <input id="ru" placeholder="Kullanıcı" value="${esc(f.user||'')}" style="width:140px">
    <label class="mut" style="display:flex;align-items:center;gap:5px"><input type="checkbox" id="ra" ${f.active?'checked':''} style="width:auto;padding:0"> Sadece şu an bağlı</label>
    <button class="btn" id="rapply">Listele</button>
    <button class="ghost" onclick="exportRdp()">📊 Excel'e aktar</button></div>`;
  if(wh)h+=`<div class="mut" style="margin-bottom:8px">Genel mesai: ${esc(wh)} · <span class="warn">turuncu</span> = mesai dışı</div>`;
  h+=`<div style="margin-bottom:10px"><b>${rows.length}</b> oturum · şu an açık <b>${open}</b> · mesai dışı <b class="${off?'warn':''}">${off}</b>`+
     (totals.length?`<br><span class="mut">Kullanıcı başına toplam süre:</span> ${totals.slice(0,10).map(t=>`<b>${esc(t.u)}</b> ${fmtDur(t.s)}`).join(' · ')}`:'')+`</div>`;
  if(!rows.length)h+='<div class="msg">Seçili aralıkta oturum yok.</div>';
  else{
    h+='<div class="tablewrap"><div class="scroll"><table><thead><tr><th>Başlangıç</th><th>Bitiş</th><th>Kullanıcı</th><th>IP</th><th>Ülke</th><th>Durum</th><th>Süre</th><th>Mesai dışı</th></tr></thead><tbody>';
    for(const r of rows){const on=r.State==='Açık'||r.State==='Bağlantı kopuk';
      h+=`<tr><td style="color:${r.OffHours?'var(--orange)':(on?'var(--green)':'')}">${fmtDT(r.Start)}</td><td>${r.End?fmtDT(r.End):'<span class="mut">—</span>'}</td><td>${esc(r.User)}</td><td>${esc(r.Ip)}</td><td>${esc(r.Country)}</td><td>${esc(r.State)}</td><td>${fmtDur(r.DurationSeconds)}${on?' <span class="mut">(sürüyor)</span>':''}</td><td class="${r.OffHours?'warn':''}">${r.OffHours?'Evet':''}</td></tr>`;}
    h+='</tbody></table></div></div>';
  }
  $('#tabc').innerHTML=h;
  $('#rapply').onclick=()=>{window._rdpF={from:$('#rf').value,to:$('#rt').value,user:$('#ru').value,active:$('#ra').checked};showRdp();};
  $('#ra').onchange=()=>$('#rapply').click();
  $('#ru').onkeydown=e=>{if(e.key==='Enter')$('#rapply').click();};
}
function exportRdp(){
  const D=window._D||{}, cust=(D.r&&D.r.CustomerName)||'musteri', rows=rdpFiltered();
  const head=['Başlangıç','Bitiş','Kullanıcı','IP','Ülke','Durum','Süre','Mesai dışı'];
  const data=rows.map(r=>[fmtDT(r.Start),r.End?fmtDT(r.End):'',r.User,r.Ip,r.Country,r.State,fmtDur(r.DurationSeconds),r.OffHours?'Evet':'']);
  if(!data.length){alert('Kayıt yok.');return;}
  dl('SecurityGuard_'+cust.replace(/[^\wğüşiöçĞÜŞİÖÇ ]/g,'')+'_rdp.xls',[head,...data]);
}

function dl(name,rows){
  const ex=s=>(s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  let t='<tr>'+rows[0].map(c=>`<th>${ex(c)}</th>`).join('')+'</tr>';
  for(let i=1;i<rows.length;i++)t+='<tr>'+rows[i].map(c=>`<td>${ex(c)}</td>`).join('')+'</tr>';
  const html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">'+
    '<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>SecurityGuard</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->'+
    '<style>table{border-collapse:collapse}td,th{border:1px solid #bbb;padding:4px 9px;mso-number-format:"\\@";font-family:Calibri,Arial;font-size:11pt}th{background:#dce6f1;font-weight:bold}</style></head>'+
    '<body><table>'+t+'</table></body></html>';
  const blob=new Blob(['\uFEFF'+html],{type:'application/vnd.ms-excel;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function exportGrid(){
  const head=['Müşteri','Makine','Durum','Lisans (gün)','Lisans bitiş','Koruma','SQL izleme','Banlı IP','24s yeni ban','24s başarısız giriş','24s kritik','Bellek (MB)','Bekleyen mail','Sürüm','Son görülme','HWID'];
  const rows=visibleRows().map(r=>{const d=daysLeft(r.ExpiresUtc);return[r.CustomerName,r.MachineName,online(r)?'Çevrimiçi':'Çevrimdışı',d==null?'':d,fmtDate(r.ExpiresUtc),
    r.LastHeartbeatUtc==null?'?':(r.ProtectionOk?'açık':'kapalı'),r.LastHeartbeatUtc==null?'?':(r.SqlMonitoring?'evet':'hayır'),
    r.BannedIps??'',r.NewBans24h??'',r.FailedLogins24h??'',r.CriticalEvents24h??'',r.MemoryMb||'',r.PendingMail??'',r.AgentVersion,fmtDT(r.LastHeartbeatUtc),r.HwId];});
  dl('SecurityGuard_musteriler_'+new Date().toISOString().slice(0,10)+'.xls',[head,...rows]);
}
function exportSection(key){
  const D=window._D||{};const rep=D.rep,cust=(D.r&&D.r.CustomerName)||'musteri';
  const sec=rep&&rep.Sections&&rep.Sections.find(s=>s.Key===key);
  if(!sec||!sec.Rows.length){alert('Kayıt yok.');return;}
  dl('SecurityGuard_'+cust.replace(/[^\wğüşiöçĞÜŞİÖÇ ]/g,'')+'_'+key+'.xls',[sec.Columns,...sec.Rows]);
}

$('#go').onclick=load;$('#refresh').onclick=load;$('#theme').onclick=cycleTheme;$('#excel').onclick=exportGrid;
$('#q').oninput=()=>ROWS.length&&render();
$('#key').onkeydown=e=>{if(e.key==='Enter')load();};
$('#remember').onchange=()=>{const k=$('#key').value.trim();if(k)saveKey(k);};
$('#ov').onclick=e=>{if(e.target.id==='ov')closeModal();};
document.onkeydown=e=>{if(e.key==='Escape')closeModal();};
$$('#filters button').forEach(b=>b.onclick=()=>{$$('#filters button').forEach(x=>x.classList.remove('on'));b.classList.add('on');FILTER=b.dataset.f;render();});
$('#key').value=loadKey();if($('#key').value)load();
</script>
</body>
</html>
